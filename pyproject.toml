[project]
name = "trusted-refund-agent"
version = "0.1.0"
description = "Refund-request agent with tools, state, human approval, tests and an eval harness."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-playwright>=0.5", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refund_agent = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "browser: end-to-end browser test (needs Playwright browsers)",
  "eval: AI evaluation harness",
]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests", "evals"]
